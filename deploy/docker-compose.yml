# deploy/docker-compose.yml — stack produksi Kiluan Fase 0 (VM Docker)
# Jalankan dari folder deploy/:
#   cp .env.contoh .env && nano .env
#   docker compose --env-file .env up -d --build
#
# Akses: https://kiluan.sainsdataciv.com  ·  https://kiluanapi.sainsdataciv.com/api/v1/sehat

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [kiluan]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [kiluan]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # mc ready local — healthcheck resmi (wget/curl tidak ada di image terbaru)
      MC_HOST_local: http://127.0.0.1:9000
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [kiluan]

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET} &&
      mc anonymous set download local/${MINIO_BUCKET} &&
      echo 'bucket ${MINIO_BUCKET} siap (lifecycle file yatim: atur ILM expiry via mc ilm bila perlu)' &&
      "
    networks: [kiluan]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_BASE_URL: ${APP_BASE_URL}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-dev}
      EMAIL_FROM: ${EMAIL_FROM}
      CUACA_AKTIF: ${CUACA_AKTIF:-false}
      CUACA_CACHE_TTL_DETIK: ${CUACA_CACHE_TTL_DETIK:-10800}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_SANDI_AWAL: ${ADMIN_SANDI_AWAL}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/sehat')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [kiluan]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Pakai endpoint ringan — SSR halaman `/` bisa lambat di VM dan gagal timeout 5s.
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/hello').then(r=>{if(!r.ok)process.exit(1);process.exit(0)}).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s
    networks: [kiluan]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-kiluan.sainsdataciv.com}
      API_DOMAIN: ${API_DOMAIN:-kiluanapi.sainsdataciv.com}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks: [kiluan]

networks:
  kiluan:
    driver: bridge

volumes:
  db_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
