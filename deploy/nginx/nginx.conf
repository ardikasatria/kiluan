# deploy/nginx/nginx.conf
# Satu entry point (port 80): frontend + API /api/* di origin yang sama.
# Subdomain API opsional (kiluanapi.*) untuk akses langsung tanpa frontend.

upstream backend_up {
    server backend:8000;
    keepalive 16;
}

upstream frontend_up {
    server frontend:3000;
    keepalive 8;
}

# ── API subdomain (opsional) ─────────────────────────────────
server {
    listen 80;
    server_name kiluanapi.sainsdataciv.com;

    client_max_body_size 25m;

    location / {
        proxy_pass         http://backend_up;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
    }
}

# ── Frontend + API same-origin (default VM / kiluan.sainsdataciv.com) ──
server {
    listen 80 default_server;
    server_name kiluan.sainsdataciv.com _;

    client_max_body_size 25m;

    # API backend (auth cookie path /api/v1/auth tetap same-origin)
    location /api/ {
        proxy_pass         http://backend_up;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
    }

    # Next.js app
    location / {
        proxy_pass         http://frontend_up;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
