# deploy/nginx/nginx.conf — reverse proxy API backend.
# Produksi: TLS untuk kiluanapi.sainsdataciv.com (certbot/Let's Encrypt).
# Frontend PWA terpisah di kiluan.sainsdataciv.com.

upstream backend_up {
    server backend:8000;
}

server {
    listen 80;
    server_name kiluanapi.sainsdataciv.com localhost;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass         http://backend_up;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        return 200 "kiluanciv API aktif. Endpoint di /api/v1\n";
        add_header Content-Type text/plain;
    }
}
